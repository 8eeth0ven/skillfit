<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc"><title id="title">SkillFit 配对评估流程</title><desc id="desc">固定任务和模型，将裸跑、加载技能与参考材料对照交给相同判官，以统一质量维度评估差异；缺失对照时显示证据不足。</desc><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#162b3a" stroke-width=".7"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#80d8bc" stroke-width="1.5"/></marker></defs><rect width="1440" height="720" fill="#071521"/><rect width="1440" height="720" fill="url(#grid)"/><g font-family="system-ui, -apple-system, PingFang SC, sans-serif"><text x="56" y="64" font-size="17" fill="#92dfc5" font-weight="600">SkillFit / EVALUATION PROTOCOL</text><text x="56" y="113" font-size="35" fill="#f3f0e7" font-weight="600">先确认有没有证据，再解释技能价值</text><text x="56" y="153" font-size="19" fill="#b7c8d4" font-weight="400">方法示意 · 不代表已有完整覆盖，也不将历史异权重总分直接相减</text><rect x="56" y="238" width="258" height="268" rx="16" fill="#0c202d" stroke="#284150"/><text x="82" y="279" font-size="23" fill="#f3f0e7" font-weight="600">01  固定比较条件</text><text x="82" y="327" font-size="19" fill="#b7c8d4" font-weight="400">同任务与验收规则</text><text x="82" y="368" font-size="19" fill="#b7c8d4" font-weight="400">同模型版本与工具环境</text><text x="82" y="409" font-size="19" fill="#b7c8d4" font-weight="400">同技能版本和运行配置</text><text x="82" y="450" font-size="19" fill="#b7c8d4" font-weight="400">保留 task / trial 标识</text><rect x="370" y="222" width="260" height="86" rx="16" fill="#0c202d" stroke="#b7c8d4"/><text x="392" y="257" font-size="22" fill="#b7c8d4" font-weight="600">M1</text><text x="392" y="287" font-size="18" fill="#b7c8d4" font-weight="400">仅任务 · 裸跑</text><rect x="370" y="330" width="260" height="86" rx="16" fill="#0c202d" stroke="#92dfc5"/><text x="392" y="365" font-size="22" fill="#92dfc5" font-weight="600">M2</text><text x="392" y="395" font-size="18" fill="#b7c8d4" font-weight="400">任务 + 技能文档</text><rect x="370" y="438" width="260" height="86" rx="16" fill="#0c202d" stroke="#efc47b"/><text x="392" y="473" font-size="22" fill="#efc47b" font-weight="600">M4</text><text x="392" y="503" font-size="18" fill="#b7c8d4" font-weight="400">任务 + 对照材料</text><path d="M318 370H359" fill="none" stroke="#80d8bc" stroke-width="2" marker-end="url(#arrow)"/><path d="M638 370H679" fill="none" stroke="#80d8bc" stroke-width="2" marker-end="url(#arrow)"/><rect x="694" y="238" width="303" height="268" rx="16" fill="#0c202d" stroke="#284150"/><text x="719" y="279" font-size="23" fill="#f3f0e7" font-weight="600">02  统一质量尺度</text><text x="719" y="327" font-size="18" fill="#b7c8d4" font-weight="400">每一对使用共有外部判官</text><text x="719" y="368" font-size="18" fill="#b7c8d4" font-weight="400">正确性 / 完整性 / 表达</text><text x="719" y="409" font-size="18" fill="#b7c8d4" font-weight="400">家族去重，自评另列诊断</text><text x="719" y="450" font-size="18" fill="#b7c8d4" font-weight="400">同任务内汇总重复试验</text><path d="M1003 370H1044" fill="none" stroke="#80d8bc" stroke-width="2" marker-end="url(#arrow)"/><rect x="1058" y="238" width="326" height="268" rx="16" fill="#0c202d" stroke="#284150"/><text x="1082" y="279" font-size="23" fill="#f3f0e7" font-weight="600">03  输出观测与缺口</text><text x="1082" y="330" font-size="20" fill="#92dfc5" font-weight="400">Δ21 = Q(M2) − Q(M1)</text><text x="1082" y="374" font-size="20" fill="#efc47b" font-weight="400">Δ24 = Q(M2) − Q(M4)</text><text x="1082" y="424" font-size="18" fill="#b7c8d4" font-weight="400">配对数、波动、异常与缺失</text><text x="1082" y="467" font-size="20" fill="#efc47b" font-weight="600">缺少对照 → 证据不足</text><rect x="56" y="576" width="1328" height="91" rx="16" fill="#0c202d" stroke="#284150"/><text x="82" y="614" font-size="21" fill="#f3f0e7" font-weight="600">模型升级后重新评估</text><text x="82" y="645" font-size="19" fill="#b7c8d4" font-weight="400">保留 / 压缩 / 重写 / 退役候选：需要预设实用阈值、可靠验收和成本证据；M3 触发测试单独报告。</text></g></svg>